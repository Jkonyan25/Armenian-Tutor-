<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Armenian Tutor</title>
  <meta name="description" content="Learn to read and speak Eastern Armenian (Yerevan) — every letter, upper and lowercase, through the Jesus Prayer, then everyday vocabulary.">
  <meta name="theme-color" content="#58cc02">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;700;800&family=Noto+Serif+Armenian:wght@500;700&family=Nunito:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Side navigation (desktop) / bottom navigation (mobile) -->
    <nav class="nav" aria-label="Main">
      <a class="nav-brand" href="#/learn" aria-label="Armenian Tutor home">
        <span class="brand-mark" aria-hidden="true">Աա</span>
        <span class="brand-name">Armenian Tutor</span>
      </a>
      <a class="nav-item" href="#/learn" data-route="learn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Learn</span>
      </a>
      <a class="nav-item" href="#/alphabet" data-route="alphabet">
        <span class="nav-glyph" aria-hidden="true">Աա</span>
        <span>Alphabet</span>
      </a>
      <a class="nav-item" href="#/prayer" data-route="prayer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4v6h6v4h-6v10h-4V12H4V8h6z"/></svg>
        <span>Prayer</span>
      </a>
      <a class="nav-item" href="#/practice" data-route="practice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
        <span>Practice</span>
      </a>
      <a class="nav-item" href="#/profile" data-route="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21a8.5 8.5 0 0 1 17 0z"/></svg>
        <span>Profile</span>
      </a>
    </nav>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-title" id="topbar-title">Armenian Tutor</div>
        <div class="topbar-stats">
          <button class="stat-pill streak" id="pill-streak" title="Day streak" aria-label="Day streak">
            <span aria-hidden="true">🔥</span><b>0</b>
          </button>
          <button class="stat-pill xp" id="pill-xp" title="Total XP" aria-label="Total XP">
            <span aria-hidden="true">⭐</span><b>0</b>
          </button>
          <button class="stat-pill goal" id="pill-goal" title="Daily goal" aria-label="Daily goal">
            <svg viewBox="0 0 36 36" class="ring" aria-hidden="true">
              <circle cx="18" cy="18" r="15" class="ring-bg"/>
              <circle cx="18" cy="18" r="15" class="ring-fg" id="goal-ring"/>
            </svg>
            <b id="goal-text">0/20</b>
          </button>
          <button class="stat-pill account" id="pill-account" hidden aria-label="Sign in"></button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <aside class="side-panel" id="side-panel" aria-label="Your progress"></aside>
  </div>

  <!-- Lesson overlay, modal and toast containers -->
  <div id="lesson" class="lesson" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Armenian Tutor needs JavaScript turned on.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/audio-manifest.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/account.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
